name: Docker Build & Push

on:
  workflow_dispatch:

jobs:
    docker-build:
        runs-on: ubuntu-24.04
        defaults:
            run:
                working-directory: "./app"
        permissions:
            security-events: write
            id-token: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Login to AWS
              uses: aws-actions/configure-aws-credentials@v4
              with:
                role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                role-session-name: github-actions-docker-session
                aws-region: eu-west-2

            - name: Login to Amazon ECR
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build
              run: |
                docker build -t threat-composer .

            - name: Tagging image to ECR repository
              run: |
                docker tag threat-composer ${{ secrets.ECR_REPOSITORY }}/threat-composer:${{ github.sha }}
                docker tag threat-composer ${{ secrets.ECR_REPOSITORY }}/threat-composer:latest

            - name: Trivy Scan
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                image-ref: threat-composer
                severity: 'CRITICAL,HIGH'
                format: 'sarif'
                output: 'trivy-results-docker.sarif'
                exit-code: 0

            - name: Upload Trivy scan results to GitHub Security tab
              uses: github/codeql-action/upload-sarif@v3
              with:
                sarif_file: 'trivy-results-docker.sarif'
                wait-for-processing: true

            - name: Push image to Amazon ECR
              run: docker push ${{ secrets.ECR_REPOSITORY }}/threat-composer --all-tags