name: Terraform Plan

on:
  workflow_dispatch:

jobs:
  terraformplan:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: "./terraform"
    permissions:
      security-events: write
      id-token: write

    steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Login to AWS
          uses: aws-actions/configure-aws-credentials@v4
          with:
            role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
            role-session-name: github-actions-terraform-session
            aws-region: eu-west-2

        - name: Setup Tflint
          uses: terraform-linters/setup-tflint@v6
          with: 
            tflint_version: v0.66.0

        - name: TFlint Scan
          run: |
            touch tflint-results-terraform.sarif
            tflint --recursive --color
          continue-on-error: true

        - name: Checkov
          uses: bridgecrewio/checkov-action@v12
          with:
            framework: terraform
            soft_fail: true
            output_format: cli,sarif
            output_file_path: checkov-results-terraform.sarif

        - name: Upload Checkov scan results to GitHub Security tab
          uses: github/codeql-action/upload-sarif@v3
          if: success() || failure()
          with:
              sarif_file: 'checkov-results-terraform.sarif'
              wait-for-processing: true

        - name: Restore terraform.tfvars
          run: | 
            printf '%s' "$TFVARS_B64" | base64 --decode > terraform.tfvars
          env:
            TFVARS_B64: ${{ secrets.TFVARS_B64 }}

        - name: Set up Terraform
          uses: hashicorp/setup-terraform@v3
          with:
              terraform_version: 1.15.8

        - name: Terraform Init
          run: terraform init

        - name: Terraform Plan
          run: terraform plan